name: Оновити дані COT

on:
  schedule:
    - cron: "15 21 * * 5"
    - cron: "0 6 * * 6"
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Завантажити дані CFTC і зібрати docs/data.js
        run: python fetch_cot.py
      - name: Зберегти зміни
        run: |
          git config user.name "cot-bot"
          git config user.email "cot-bot@users.noreply.github.com"
          git add docs/data.js
          if git diff --cached --quiet; then
            echo "Нових даних немає"
          else
            git commit -m "Оновлено дані COT"
            git push
          fi
